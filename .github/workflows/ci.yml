name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5433/securefiles
      DATABASE_USERNAME: securefiles
      DATABASE_PASSWORD: securefiles-local-only
      JWT_SECRET: ci-only-integration-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start integration services
        working-directory: .
        run: docker compose up -d --wait postgres minio rabbitmq clamav
      - name: Run authentication integration
        env:
          SECUREFILES_AUTH_INTEGRATION: 'true'
        run: mvn --batch-mode -Dtest=UserAuthenticationFlowIntegrationTest test
      - name: Run scan integration
        env:
          SECUREFILES_INTEGRATION: 'true'
        run: mvn --batch-mode -Dtest=FileScanFlowIntegrationTest test
      - name: Apply low ClamAV limit override
        working-directory: .
        run: docker compose -f docker-compose.yml -f docker-compose.integration-scan-limit.yml up -d --force-recreate --wait clamav
      - name: Run ClamAV size-limit integration
        env:
          SECUREFILES_SCAN_LIMIT_INTEGRATION: 'true'
        run: mvn --batch-mode -Dtest=FileScanSizeLimitIntegrationTest test
      - name: Stop integration services
        if: always()
        working-directory: .
        run: docker compose down -v
