services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securefiles}
      POSTGRES_USER: ${POSTGRES_USER:-securefiles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securefiles-local-only}
    ports:
      - "5432:5432"
    volumes:
      - securefiles-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securefiles} -d ${POSTGRES_DB:-securefiles}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - securefiles-clamav:/var/lib/clamav

volumes:
  securefiles-postgres:
  securefiles-clamav:
